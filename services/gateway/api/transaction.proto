syntax = "proto3";

package transaction.v1;

option go_package = "github.com/mibrgmv/payment-service/services/transaction/internal/protogen/transaction;transactionv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service TransactionService {
  rpc CreateTransfer(CreateTransferRequest) returns (Transaction) {
    option (google.api.http) = {
      post: "/v1/transfers"
      body: "*"
    };
  }

  rpc CreateDeposit(CreateDepositRequest) returns (Transaction) {
    option (google.api.http) = {
      post: "/v1/deposits"
      body: "*"
    };
  }

  rpc CreateWithdrawal(CreateWithdrawalRequest) returns (Transaction) {
    option (google.api.http) = {
      post: "/v1/withdrawals"
      body: "*"
    };
  }

  rpc GetTransaction(GetTransactionRequest) returns (Transaction) {
    option (google.api.http) = {
      get: "/v1/transactions/{transaction_id}"
    };
  }

  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {
      get: "/v1/transactions"
    };
  }

  rpc GetTransactionStatus(GetTransactionStatusRequest) returns (TransactionStatusResponse) {
    option (google.api.http) = {
      get: "/v1/transactions/{transaction_id}/status"
    };
  }
}

message Transaction {
  string transaction_id = 1;
  TransactionType type = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  double amount = 5;
  Currency currency = 6;
  TransactionStatus status = 7;
  string idempotency_key = 8;
  string error_message = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp completed_at = 12;
}

message CreateTransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  double amount = 3;
  Currency currency = 4;
  string idempotency_key = 5;
}

message CreateDepositRequest {
  string to_account_id = 1;
  double amount = 2;
  Currency currency = 3;
  string idempotency_key = 4;
}

message CreateWithdrawalRequest {
  string from_account_id = 1;
  double amount = 2;
  Currency currency = 3;
  string idempotency_key = 4;
}

message GetTransactionRequest {
  string transaction_id = 1;
}

message ListTransactionsRequest {
  repeated string account_ids = 1;
  TransactionType type = 2;
  TransactionStatus status = 3;
  google.protobuf.Timestamp from_date = 4;
  google.protobuf.Timestamp to_date = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string next_page_token = 2;
}

message GetTransactionStatusRequest {
  string transaction_id = 1;
}

message TransactionStatusResponse {
  string transaction_id = 1;
  TransactionStatus status = 2;
  google.protobuf.Timestamp last_updated = 3;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_TRANSFER = 1;
  TRANSACTION_TYPE_DEPOSIT = 2;
  TRANSACTION_TYPE_WITHDRAWAL = 3;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_COMPLETED = 3;
  TRANSACTION_STATUS_FAILED = 4;
}

enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_RUB = 1;
  CURRENCY_USD = 2;
  CURRENCY_EUR = 3;
}
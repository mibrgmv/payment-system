services:
  account-postgres:
    container_name: account-postgres
    image: postgres:latest
    environment:
      - POSTGRES_USER=bill_clinton
      - POSTGRES_PASSWORD=2001
      - POSTGRES_DB=account_service
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - account-postgres-data:/var/lib/postgresql/data
    networks:
      - payment-system-network

  transaction-postgres:
    container_name: transaction-postgres
    image: postgres:latest
    environment:
      - POSTGRES_USER=solid_snake
      - POSTGRES_PASSWORD=gv%R*uJBHI)J
      - POSTGRES_DB=transaction_service
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - transaction-postgres-data:/var/lib/postgresql/data
    networks:
      - payment-system-network

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNkYwNkJCMzJBQg==
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - payment-system-network

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - payment-system-network

volumes:
  account-postgres-data:
  transaction-postgres-data:
  kafka-data:

networks:
  payment-system-network:
    driver: bridge

services:
  payment-gateway:
    container_name: payment-gateway
    build:
      context: gateway
      dockerfile: Dockerfile
      target: gateway
    ports:
      - "8080:8080"
    environment:
      ACCOUNT_SERVICE_HOST: account-service
      ACCOUNT_SERVICE_PORT: 50051
      TRANSACTION_SERVICE_HOST: transaction-service
      TRANSACTION_SERVICE_PORT: 50052
    depends_on:
      - account-service
      - transaction-service
    restart: unless-stopped
    networks:
      - payment-system-network

  account-kafka-publisher:
    container_name: account-kafka-publisher
    build:
      context: account
      dockerfile: Dockerfile
      target: account-kafka-publisher
    environment:
      ACCOUNT_SERVICE_POSTGRES_PORT: 5432
      ACCOUNT_SERVICE_POSTGRES_HOST: account-postgres
      ACCOUNT_SERVICE_POSTGRES_USERNAME: bill_clinton
      ACCOUNT_SERVICE_POSTGRES_PASSWORD: 2001
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka
      - account-service
    restart: unless-stopped
    networks:
      - payment-system-network

  account-kafka-processor:
    container_name: account-kafka-processor
    build:
      context: account
      dockerfile: Dockerfile
      target: account-kafka-processor
    environment:
      ACCOUNT_SERVICE_POSTGRES_PORT: 5432
      ACCOUNT_SERVICE_POSTGRES_HOST: account-postgres
      ACCOUNT_SERVICE_POSTGRES_USERNAME: bill_clinton
      ACCOUNT_SERVICE_POSTGRES_PASSWORD: 2001
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka
      - account-service
    restart: unless-stopped
    networks:
      - payment-system-network

  account-service:
    container_name: account-service
    build:
      context: account
      dockerfile: Dockerfile
      target: account-service
    ports:
      - "50051:50051"
    environment:
      ACCOUNT_SERVICE_HOST: account-service
      ACCOUNT_SERVICE_PORT: 50051
      ACCOUNT_SERVICE_POSTGRES_PORT: 5432
      ACCOUNT_SERVICE_POSTGRES_HOST: account-postgres
      ACCOUNT_SERVICE_POSTGRES_USERNAME: bill_clinton
      ACCOUNT_SERVICE_POSTGRES_PASSWORD: 2001
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - account-postgres
      - kafka
    restart: unless-stopped
    networks:
      - payment-system-network

  account-postgres:
    container_name: account-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bill_clinton
      POSTGRES_PASSWORD: 2001
      POSTGRES_DB: account_service
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - account-postgres-data:/var/lib/postgresql/data
    networks:
      - payment-system-network

  transaction-kafka-publisher:
    container_name: transaction-kafka-publisher
    build:
      context: transaction
      dockerfile: Dockerfile
      target: transaction-kafka-publisher
    environment:
      TRANSACTION_SERVICE_POSTGRES_PORT: 5432
      TRANSACTION_SERVICE_POSTGRES_HOST: transaction-postgres
      TRANSACTION_SERVICE_POSTGRES_USERNAME: solid_snake
      TRANSACTION_SERVICE_POSTGRES_PASSWORD: gv%R*uJBHI)J
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka
      - transaction-service
    restart: unless-stopped
    networks:
      - payment-system-network

  transaction-kafka-processor:
    container_name: transaction-kafka-processor
    build:
      context: transaction
      dockerfile: Dockerfile
      target: transaction-kafka-processor
    environment:
      TRANSACTION_SERVICE_POSTGRES_PORT: 5432
      TRANSACTION_SERVICE_POSTGRES_HOST: transaction-postgres
      TRANSACTION_SERVICE_POSTGRES_USERNAME: solid_snake
      TRANSACTION_SERVICE_POSTGRES_PASSWORD: gv%R*uJBHI)J
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka
      - transaction-service
    restart: unless-stopped
    networks:
      - payment-system-network

  transaction-service:
    container_name: transaction-service
    build:
      context: transaction
      dockerfile: Dockerfile
      target: transaction-service
    ports:
      - "50052:50052"
    environment:
      TRANSACTION_SERVICE_HOST: transaction-service
      TRANSACTION_SERVICE_PORT: 50052
      TRANSACTION_SERVICE_POSTGRES_PORT: 5432
      TRANSACTION_SERVICE_POSTGRES_HOST: transaction-postgres
      TRANSACTION_SERVICE_POSTGRES_USERNAME: solid_snake
      TRANSACTION_SERVICE_POSTGRES_PASSWORD: gv%R*uJBHI)J
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - transaction-postgres
      - kafka
    restart: unless-stopped
    networks:
      - payment-system-network

  transaction-postgres:
    container_name: transaction-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: solid_snake
      POSTGRES_PASSWORD: gv%R*uJBHI)J
      POSTGRES_DB: transaction_service
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - transaction-postgres-data:/var/lib/postgresql/data
    networks:
      - payment-system-network

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNkYwNkJCMzJBQg==
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - payment-system-network

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - payment-system-network

volumes:
  account-postgres-data:
  transaction-postgres-data:
  kafka-data:

networks:
  payment-system-network:
    driver: bridge
